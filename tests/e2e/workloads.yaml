# Two workloads for the end-to-end test: one healthy, one that can never start.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good
  namespace: e2e
spec:
  replicas: 2
  selector:
    matchLabels: {app: good}
  template:
    metadata:
      labels: {app: good}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: e2e
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels: {app: broken}
  template:
    metadata:
      labels: {app: broken}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/healthcheck-e2e/does-not-exist:v0.0.0
          resources:
            requests: {cpu: 10m, memory: 16Mi}
