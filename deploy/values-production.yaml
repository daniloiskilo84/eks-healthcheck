# ─────────────────────────────────────────────────────────────────────────────
#  YOUR APP SETTINGS for the cluster. Where to build/push/deploy is in
#  deploy/pipeline.env; the pipeline adds, from that file:
#    clusterName      ← EKS_CLUSTER_NAME
#    image.repository ← IMAGE_REPOSITORY (your registry, your build)
#    image.tag        ← the commit SHA
#  Every option, with its default: chart/eks-healthcheck/values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# Which namespaces to watch. Empty = all. Excluded ones are hidden everywhere
# (list, logs and rollout), e.g. to keep app teams away from kube-system.
namespaces: []
excludeNamespaces: []
# excludeNamespaces: [kube-system, kube-node-lease]

# The rollout restart button is a write action on the cluster.
# false removes the button, the API endpoint and the RBAC "patch" permission.
rollout:
  enabled: true

# How it is reached. Without an ingress: kubectl port-forward (see the chart NOTES).
# With the AWS Load Balancer Controller installed, an INTERNAL ALB inside the VPC:
ingress:
  enabled: false
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # HTTPS with an ACM certificate:
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:123456789012:certificate/...
  hosts:
    - host: healthcheck.internal.example.com
      paths: ["/"]

# Login for the UI and API. Better: an ingress with SSO (ALB + Cognito/OIDC, or
# oauth2-proxy). If you use this, create the Secret yourself so the password is
# not in git:
#   kubectl -n healthcheck create secret generic healthcheck-auth \
#     --from-literal=username=ops --from-literal=password='...'
auth:
  enabled: false
  existingSecret: ""
  # existingSecret: healthcheck-auth

# Refresh rates and how often the Kubernetes API is listed (one LIST per TTL,
# however many people are watching).
refresh:
  pageSeconds: 30
  tvSeconds: 15
cacheTtlSeconds: 10

# Scheduling, e.g. keep it off Spot nodes:
# nodeSelector:
#   eks.amazonaws.com/capacityType: ON_DEMAND

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
