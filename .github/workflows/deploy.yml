name: deploy

# Runs after "ci" succeeds on main: push → tests → kind e2e → image → EKS.
#
# Configure your fork with repository VARIABLES (Settings → Secrets and variables →
# Actions → Variables); `terraform -chdir=infra output github_setup` prints the commands:
#   AWS_REGION           e.g. us-east-1
#   EKS_CLUSTER_NAME     the cluster to deploy to (without it the eks job is skipped)
#   AWS_DEPLOY_ROLE_ARN  IAM role assumed through GitHub OIDC (infra/ creates it)
#   ECR_REPOSITORY       optional; without it the image goes to ghcr.io/<owner>/eks-healthcheck
#   HELM_NAMESPACE       optional; default "healthcheck"
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC: GitHub gets short-lived AWS credentials, no access keys stored

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.target.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Pick the registry
        id: target
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$ECR_REPOSITORY" ]; then
            echo "repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            echo "repository=ghcr.io/${OWNER,,}/eks-healthcheck" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS credentials (ECR)
        if: vars.ECR_REPOSITORY != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        if: vars.ECR_REPOSITORY != ''
        uses: aws-actions/amazon-ecr-login@v2
      - name: Log in to GHCR
        if: vars.ECR_REPOSITORY == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build and push (amd64 + arm64 for Graviton nodes)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.target.outputs.repository }}:${{ env.SHA }}
            ${{ steps.target.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}

  eks:
    needs: image
    # Skipped until EKS_CLUSTER_NAME exists, so forks without a cluster stay green.
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: ${{ vars.HELM_NAMESPACE || 'healthcheck' }}
      CLUSTER: ${{ vars.EKS_CLUSTER_NAME }}
      REGION: ${{ vars.AWS_REGION }}
      REPOSITORY: ${{ needs.image.outputs.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Helm upgrade
        run: |
          helm upgrade --install healthcheck chart/eks-healthcheck \
            --namespace "$NAMESPACE" --create-namespace \
            -f deploy/values-production.yaml \
            --set clusterName="$CLUSTER" \
            --set image.repository="$REPOSITORY" \
            --set image.tag="$SHA" \
            --atomic --wait --timeout 5m
      - name: Smoke test
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/healthcheck-eks-healthcheck 18080:80 &
          for i in $(seq 20); do curl -sf localhost:18080/readyz && break; sleep 3; done
          curl -sf localhost:18080/api/summary | jq '{cluster, healthy, deployments, nodes}'
          echo "### healthcheck deployed to $CLUSTER" >> "$GITHUB_STEP_SUMMARY"
          echo "Image \`$REPOSITORY:$SHA\`, namespace \`$NAMESPACE\`" >> "$GITHUB_STEP_SUMMARY"
