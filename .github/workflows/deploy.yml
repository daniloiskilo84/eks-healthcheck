name: deploy

# Runs after "ci" succeeds on main: push → tests → kind e2e → image → EKS.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC: GitHub gets short-lived AWS credentials, no access keys stored

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/eks-healthcheck
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64 for Graviton nodes)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}

  eks:
    needs: image
    # Skipped until the repository variables below exist, so forks stay green.
    if: vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Helm upgrade
        run: |
          helm upgrade --install healthcheck chart/eks-healthcheck \
            --namespace healthcheck --create-namespace \
            -f deploy/values-production.yaml \
            --set clusterName="${{ vars.EKS_CLUSTER_NAME }}" \
            --set image.tag="$SHA" \
            --atomic --wait --timeout 5m
      - name: Smoke test
        run: |
          kubectl -n healthcheck port-forward svc/healthcheck-eks-healthcheck 18080:80 &
          for i in $(seq 20); do curl -sf localhost:18080/readyz && break; sleep 3; done
          curl -sf localhost:18080/api/summary | jq '{cluster, healthy, deployments, nodes}'
