name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff format --check . && ruff check .
      - name: Unit and API tests
        run: pytest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Lint chart
        run: helm lint --strict chart/eks-healthcheck --set image.repository=registry.example.com/eks-healthcheck
      - name: Render every variant
        run: |
          # no image of our own is ever assumed: rendering without one must fail
          ! helm template t chart/eks-healthcheck 2>/dev/null
          IMG="--set image.repository=registry.example.com/eks-healthcheck"
          helm template t chart/eks-healthcheck $IMG > /dev/null
          helm template t chart/eks-healthcheck $IMG -f deploy/values-production.yaml > /dev/null
          helm template t chart/eks-healthcheck $IMG --set demoMode=true > /dev/null
          helm template t chart/eks-healthcheck $IMG | grep -q '"patch"'
          ! helm template t chart/eks-healthcheck $IMG --set rollout.enabled=false | grep -q '"patch"'
          helm template t chart/eks-healthcheck $IMG --set auth.enabled=true --set auth.password=x --set ingress.enabled=true > /dev/null
          ! helm template t chart/eks-healthcheck $IMG --set auth.enabled=true 2>/dev/null
      - name: pipeline.env parses
        run: bash -n deploy/pipeline.env && (set -a; . deploy/pipeline.env; set +a; echo "HELM_NAMESPACE=$HELM_NAMESPACE")

  infra:
    name: infra (terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Tests with a mocked AWS provider
        run: terraform test

  e2e:
    name: e2e (kind)
    needs: [test, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t eks-healthcheck:e2e .
      - name: Scan image (critical, fixable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eks-healthcheck:e2e
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: helm/kind-action@v1.15.2
        with:
          cluster_name: e2e
      - uses: azure/setup-helm@v5
        with:
          version: v3.22.1
      - name: Load image into kind
        run: kind load docker-image eks-healthcheck:e2e --name e2e
      - name: End-to-end
        run: bash scripts/e2e-kind.sh
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n healthcheck describe pods
          kubectl -n healthcheck logs deploy/hc-eks-healthcheck --tail=200
