[project]
name = "eks-healthcheck"
version = "1.0.0"
description = "Deployment, pod and node health for an EKS cluster, with a TV dashboard"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"app/demo.py" = ["S311"]  # random is for fake data, not security
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
